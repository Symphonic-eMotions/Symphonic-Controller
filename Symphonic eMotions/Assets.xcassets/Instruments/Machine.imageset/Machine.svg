<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg"> <!-- Table top -->
  <rect x="20" y="20" width="260" height="160" rx="21" ry="21" stroke="white" stroke-width="4" fill="#000000" fill-opacity="0.0"  />

  <!-- Knob 1 -->
  <g transform="rotate(45, 80, 60)">
    <circle cx="80" cy="60" r="20" stroke="white" stroke-width="4" fill="#CCCCCC" fill-opacity="0.0" />
    <rect x="75" y="35" width="10" height="50" stroke="white" stroke-width="2" fill="#ffffff" />
  </g>

  <!-- Knob 2 -->
  <g transform="rotate(-30, 150, 60)">
    <circle cx="150" cy="60" r="20" stroke="white" stroke-width="4" fill="#CCCCCC" fill-opacity="0.0" />
    <rect x="145" y="35" width="10" height="50" stroke="white" stroke-width="2" fill="#ffffff" />
  </g>

  <!-- Slider -->
  <g transform="rotate(90, 220, 140)">
    <rect x="120" y="115" width="125" height="20" rx="10" ry="10" stroke="white" stroke-width="4" fill="#CCCCCC" fill-opacity="0.0" />
    <circle cx="200" cy="125" r="10" stroke="white" stroke-width="2" fill="#ffffff" />
  </g>

  <!-- Knob 4 -->
  <g transform="rotate(60, 80, 140)">
    <circle cx="80" cy="140" r="20" stroke="white" stroke-width="4" fill="#CCCCCC" fill-opacity="0.0" />
    <rect x="75" y="115" width="10" height="50" stroke="white" stroke-width="2" fill="#ffffff" />
  </g>

  <!-- Knob 5 -->
  <g transform="rotate(60, 150, 140)">
  	<circle cx="150" cy="140" r="20" stroke="white" stroke-width="4" fill="#CCCCCC" fill-opacity="0.0" />
  	<rect x="145" y="115" width="10" height="50" stroke="white" stroke-width="2" fill="#ffffff" />
  </g>
</svg>